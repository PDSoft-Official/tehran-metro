    :root {
      --font: 'IRANSansXVF', -apple-system, BlinkMacSystemFont, sans-serif;
      --ios-spring: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);

      /* Line Colors (Line 6 exact PDF pink #F06CA9) */
      --l1: #FF2D55;
      --l2: #0A84FF;
      --l3: #32ADE6;
      --l4: #FFD60A;
      --l5: #30D158;
      --l6: #F06CA9;
      --l7: #BF5AF2;
    }

    html[data-theme="night"] {
      --bg-map: #060911;
      --bg-grid: rgba(255, 255, 255, 0.024);
      --glass-bg: rgba(22, 28, 42, 0.65);
      --glass-bg-heavy: rgba(16, 21, 33, 0.84);
      --glass-card: rgba(255, 255, 255, 0.065);
      --glass-card-hover: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-specular: rgba(255, 255, 255, 0.28);
      --glass-shadow: 0 18px 42px -8px rgba(0, 0, 0, 0.62), inset 0 1px 0.5px rgba(255, 255, 255, 0.25);
      --text-main: #F8FAFC;
      --text-sub: rgba(248, 250, 252, 0.64);
      --text-muted: rgba(248, 250, 252, 0.42);
      --station-fill: #0B101D;
      --label-color: #E2E8F0;
      --label-halo: #060911;
      --accent: #38BDF8;
      --emerald: #30D158;
      --danger: #FF453A;
      --gold: #FFD60A;
      --track-casing: rgba(6, 9, 17, 0.86);
    }

    html[data-theme="day"] {
      --bg-map: #F4F2EC;
      --bg-grid: rgba(15, 23, 42, 0.035);
      --glass-bg: rgba(255, 255, 255, 0.70);
      --glass-bg-heavy: rgba(255, 255, 255, 0.88);
      --glass-card: rgba(15, 23, 42, 0.048);
      --glass-card-hover: rgba(15, 23, 42, 0.09);
      --glass-border: rgba(255, 255, 255, 0.78);
      --glass-specular: rgba(255, 255, 255, 0.95);
      --glass-shadow: 0 14px 36px -8px rgba(15, 23, 42, 0.14), 0 2px 8px rgba(15, 23, 42, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.9);
      --text-main: #0F172A;
      --text-sub: rgba(15, 23, 42, 0.62);
      --text-muted: rgba(15, 23, 42, 0.44);
      --station-fill: #FFFFFF;
      --label-color: #1E293B;
      --label-halo: #F4F2EC;
      --accent: #007AFF;
      --emerald: #24B83B;
      --danger: #FF3B30;
      --gold: #D97706;
      --track-casing: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      font-feature-settings: "ss02" 1;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-map);
      color: var(--text-main);
      font-variation-settings: "wght" 460, "DOTS" 3;
      position: fixed;
      inset: 0;
    }

    /* GPU-Composited Day/Night Crossfade Veil (Zero Lag Theme Switch) */
    #theme-veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0;
      will-change: opacity;
      transition: opacity 0.28s var(--ease-smooth);
    }

    .vf-reg { font-variation-settings: "wght" 430, "DOTS" 3; }
    .vf-med { font-variation-settings: "wght" 560, "DOTS" 3; }
    .vf-bold { font-variation-settings: "wght" 720, "DOTS" 3; }
    .vf-heavy { font-variation-settings: "wght" 860, "DOTS" 3; }
    .tnum { font-variant-numeric: tabular-nums; }

    /* iOS Liquid Glass Surface Base */
    .liquid-glass {
      background: var(--glass-bg);
      backdrop-filter: blur(26px) saturate(190%);
      -webkit-backdrop-filter: blur(26px) saturate(190%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      transition: transform 0.36s var(--ios-spring), opacity 0.25s ease;
    }

    .liquid-glass-heavy {
      background: var(--glass-bg-heavy);
      backdrop-filter: blur(34px) saturate(200%);
      -webkit-backdrop-filter: blur(34px) saturate(200%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      transition: transform 0.42s var(--ios-spring), opacity 0.25s ease;
    }

    /* Full-Screen Map Viewport */
    #map-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
      z-index: 1;
      background-image:
        radial-gradient(circle at 50% 45%, rgba(56, 189, 248, 0.045) 0%, transparent 65%);
      background-size: 100% 100%;
    }

    #map-stage:active { cursor: grabbing; }

    #map-transform-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #metro-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: hidden;
      direction: ltr;
      shape-rendering: geometricPrecision;
      text-rendering: geometricPrecision;
    }

    #svg-trains-layer { pointer-events: none; }

    /* Minimal, Fast SVG Map Styles */
    .metro-line-casing {
      fill: none;
      stroke: var(--track-casing);
      stroke-width: 20px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .metro-line-path {
      fill: none;
      stroke-width: 14px;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
    }

    .station-group {
      cursor: pointer;
    }

    .station-hit {
      fill: transparent;
      r: 26px;
    }

    .station-label-fa {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 630;
      text-rendering: geometricPrecision;
      fill: var(--label-color);
      font-variation-settings: "wght" 630, "DOTS" 3;
      paint-order: stroke;
      stroke: var(--label-halo);
      stroke-width: 3.2px;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .dimmed {
      opacity: 0.14;
    }

    /* Animated Route Overlay */
    .route-line-solid {
      fill: none;
      stroke-width: 16px;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .route-line-flow {
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 10 18;
      animation: dash-flow 0.85s linear infinite;
      pointer-events: none;
    }

    @keyframes dash-flow {
      to { stroke-dashoffset: -28; }
    }

    /* TOP FLOATING LIQUID GLASS BAR (iOS Dynamic Capsule) */
    .top-floating-bar {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      max-width: 460px;
      margin: 0 auto;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 7px;
      pointer-events: none;
    }

    .top-capsule {
      pointer-events: auto;
      height: 46px;
      border-radius: 999px;
      padding: 0 6px 0 7px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Settings & Sync Dot Indicator in Top Capsule */
    .sync-pill-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      text-decoration: none;
      transition: transform 0.18s var(--ios-spring);
    }

    .sync-pill-btn:active { transform: scale(0.94); }

    .pdsoft-tg-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(10, 132, 255, 0.16));
      border: 1px solid rgba(56, 189, 248, 0.42);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11.5px;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: none;
      box-shadow: inset 0 1px 0.5px var(--glass-specular);
      transition: transform 0.18s var(--ios-spring), background-color 0.2s;
    }

    .pdsoft-tg-btn:active { transform: scale(0.94); }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 6px var(--emerald);
      flex-shrink: 0;
    }

    .status-dot.syncing {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse-op 1s infinite alternate;
    }

    .status-dot.offline {
      background: #F59E0B;
      box-shadow: 0 0 6px #F59E0B;
    }

    @keyframes pulse-op {
      from { opacity: 0.35; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1.15); }
    }

    /* Quick Station Search inside Top Capsule */
    .top-search-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      min-width: 120px;
    }

    .top-search-input {
      width: 100%;
      height: 32px;
      border-radius: 999px;
      background: var(--glass-card);
      border: 1px solid transparent;
      color: var(--text-main);
      padding: 0 25px 0 8px;
      font-size: 11.5px;
      outline: none;
      transition: border-color 0.2s;
    }

    .top-search-input::placeholder {
      color: var(--text-muted);
      font-size: 11px;
    }

    .top-search-input:focus {
      border-color: var(--accent);
      background: var(--glass-card-hover);
    }

    .top-search-icon {
      position: absolute;
      right: 8px;
      color: var(--text-muted);
      pointer-events: none;

    /* Floating Quick Tap Bubble on Map */
    .map-tap-bubble {

      z-index: 35;

    .map-tap-bubble.open {

    .pill-action {

    .pill-action:active { transform: scale(0.95); }
  

    @media(prefers-reduced-motion:reduce){.route-line-flow{animation:none!important;}}

    /* Immersive map: no persistent floating exit button or hidden hit targets. */
    #map-top-controls, #map-bottom-controls, #sheet-backdrop, #map-tap-bubble {
      transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.2, 0.7, 0.2, 1), visibility 0s;

      if (!sid || !METRO_DATA.stations[sid]) return;
      const idx = STATE.favStations.indexOf(sid);
      if (idx >= 0) STATE.favStations.splice(idx, 1);
      else STATE.favStations.unshift(sid);
      saveFavoritesToStorage();
      refreshFavoriteUIViews();
    }

    function isFavRoute(fromId, toId) {
      return STATE.favRoutes.some(r => r.from === fromId && r.to === toId);
    }

    function toggleFavRoute(fromId, toId) {
      if (!fromId || !toId || fromId === toId) return;
      const idx = STATE.favRoutes.findIndex(r => r.from === fromId && r.to === toId);
      if (idx >= 0) STATE.favRoutes.splice(idx, 1);
      else STATE.favRoutes.unshift({ from: fromId, to: toId });
      saveFavoritesToStorage();
      refreshFavoriteUIViews();
    }

    function refreshFavoriteUIViews() {
      if (STATE.selectedStationId) {
        const bFav = document.getElementById('btn-bubble-fav');
        if (bFav) {
          const fav = isFavStation(STATE.selectedStationId);
          bFav.textContent = fav ? '⭐' : '☆';
          bFav.style.color = fav ? 'var(--gold)' : 'var(--text-main)';
        }
      }
      if (STATE.activeSheetPane === 'route') renderRouteView(false);
      if (STATE.activeSheetPane === 'station') renderStationBoardView();
      if (STATE.activeSheetPane === 'favs') renderFavoritesPane();
    }

    // Cached DOM references & Prebuilt Routing Graph for Zero-Lag Switching
    let CACHED_LINE_ELS = [];
    let CACHED_STATION_ELS = [];
    let ADJ_GRAPH = null;
    const ROUTE_PATH_CACHE = new Map();
    const TIMETABLE_CACHE = {};

    function getTehranLiveClock(now = new Date()) {
      try {
        const parts = new Intl.DateTimeFormat('en-US', {
          timeZone: 'Asia/Tehran',
          hour12: false,
          weekday: 'short',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        }).formatToParts(now);
        let h = 0, m = 0, s = 0, wd = 'Mon';
        for (const p of parts) {
          if (p.type === 'hour') h = parseInt(p.value, 10) % 24;
          if (p.type === 'minute') m = parseInt(p.value, 10);
          if (p.type === 'second') s = parseInt(p.value, 10);
          if (p.type === 'weekday') wd = p.value;
        }
        const dayType = wd === 'Fri' ? 'friday' : (wd === 'Thu' ? 'thursday' : 'weekday');
        return { seconds: h * 3600 + m * 60 + s, dayType };
      } catch (e) {
        const d = new Date(now.getTime() + 210 * 60000);
        const day = d.getUTCDay();
        return { seconds: d.getUTCHours() * 3600 + d.getUTCMinutes() * 60 + d.getUTCSeconds(), dayType: day === 5 ? 'friday' : day === 4 ? 'thursday' : 'weekday' };
      }
    }

    function syncClockSliderUI() {
      const curMin = Math.floor(STATE.secondsOfDay / 60);
      const sTime = document.getElementById('slider-time');
      const sLabel = document.getElementById('slider-time-label');
      const liveBtn = document.getElementById('btn-live-clock-reset');
      if (sTime) sTime.value = String(curMin);
      if (sLabel) sLabel.textContent = fmtHM(curMin);
      if (liveBtn) {
        liveBtn.style.color = STATE.useLiveTime ? 'var(--emerald)' : 'var(--accent)';
        liveBtn.textContent = STATE.useLiveTime ? '● ساعت زنده تهران' : 'بازگشت به ساعت زنده تهران';
      }
      document.querySelectorAll('.day-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.day === STATE.dayType);
      });
    }

    function getHeadway(lineId, minOfDay, dayType) {
      const meta = LINES_META[lineId] || LINES_META["1"];
      if (lineId === "1b") return 120;
      const isRush = (minOfDay >= 390 && minOfDay <= 570) || (minOfDay >= 960 && minOfDay <= 1200);
      if (dayType === 'friday') return meta.off + 2;
      if (dayType === 'thursday') return isRush ? meta.peak + 1 : meta.norm + 1;
      return isRush ? meta.peak : ((minOfDay < 390 || minOfDay > 1230) ? meta.off : meta.norm);
    }

    // One geometry and timetable model for canvas trains, route overlays and boards.
    // IMPORTANT: the source file supplied no dated operator timetable. Existing
    // headways and segment times are retained as UNVERIFIED SIMULATION assumptions.
    const SCHEDULE_INFO = Object.freeze({
      mode: 'simulation', verified: false, source: 'Embedded parameters from the supplied Metro.html',
      effectiveDate: null, checkedOn: '2026-11-09', dwellSeconds: 20
    });
    const LINE_GEOMETRY = {};
    const SERVICE_STOPS = {};
    const TRIP_STOP_CACHE = new Map();
    const DAY_SECONDS = 86400;

    function buildTrainGeometry() {
      for (const [lid, points] of Object.entries(METRO_DATA.polylines)) {
        const segments = [];
        let length = 0;
        for (let i = 1; i < points.length; i++) {
          const a = points[i - 1], b = points[i];
          const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
          if (!len) continue;
          segments.push({ a, b, start: length, end: length + len, length: len });
          length += len;
        }
        const stationDistances = {};
        for (const sid of METRO_DATA.lineSequences[lid]) {
          const st = METRO_DATA.stations[sid];
          let best = Infinity, distance = 0;
          for (const seg of segments) {
            const dx = seg.b[0] - seg.a[0], dy = seg.b[1] - seg.a[1];
            const t = Math.max(0, Math.min(1, ((st.x - seg.a[0]) * dx + (st.y - seg.a[1]) * dy) / (seg.length * seg.length)));
            const error = Math.hypot(st.x - seg.a[0] - t * dx, st.y - seg.a[1] - t * dy);
            if (error < best) { best = error; distance = seg.start + t * seg.length; }
          }
          stationDistances[sid] = distance;
        }
        LINE_GEOMETRY[lid] = { segments, length, stationDistances };
        // Closed intermediate stations are passed without stopping; closed
        // extensions are never modelled as running passenger service.
        SERVICE_STOPS[lid] = METRO_DATA.lineSequences[lid].filter(sid => METRO_DATA.stations[sid].status !== 'construction');
      }
      TRIP_STOP_CACHE.clear();
    }

    function getServiceSequence(lid) {
      return SERVICE_STOPS[lid] || (METRO_DATA.lineSequences[lid] || []).filter(sid => METRO_DATA.stations[sid].status !== 'construction');
    }

    function pointOnTrack(lid, distance, direction = 1) {
      const geom = LINE_GEOMETRY[lid];
      const d = Math.max(0, Math.min(geom.length, distance));
      let lo = 0, hi = geom.segments.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (geom.segments[mid].end < d) lo = mid + 1; else hi = mid;
      }
      const seg = geom.segments[lo];
      const t = (d - seg.start) / seg.length;
      const dx = seg.b[0] - seg.a[0], dy = seg.b[1] - seg.a[1];
      return { x: seg.a[0] + t * dx, y: seg.a[1] + t * dy,
        angle: Math.atan2(dy * direction, dx * direction) };
    }

    function trackSlice(lid, fromId, toId) {
      const geom = LINE_GEOMETRY[lid];
      const from = geom.stationDistances[fromId], to = geom.stationDistances[toId];
      const low = Math.min(from, to), high = Math.max(from, to);
      const pts = [pointOnTrack(lid, low)];
      for (const seg of geom.segments) if (seg.end > low && seg.end < high) pts.push({ x: seg.b[0], y: seg.b[1] });
      pts.push(pointOnTrack(lid, high));
      return from <= to ? pts : pts.reverse();
    }

    function getTripStops(lid, dir) {
      const key = `${lid}|${dir}`;
      if (TRIP_STOP_CACHE.has(key)) return TRIP_STOP_CACHE.get(key);
      const seq = getServiceSequence(lid), raw = METRO_DATA.lineSequences[lid];
      const ids = dir === 1 ? seq : [...seq].reverse();
      if (ids.length < 2) return [];
      const originIndex = raw.indexOf(ids[0]);
      const stops = ids.map((sid, index) => {
        const arrival = Math.abs(raw.indexOf(sid) - originIndex) * LINES_META[lid].sec;
        return { sid, arrival, departure: index === 0 ? 0 : arrival + SCHEDULE_INFO.dwellSeconds,
          distance: LINE_GEOMETRY[lid].stationDistances[sid] };
      });
      TRIP_STOP_CACHE.set(key, stops);
      return stops;
    }

    function lowerBound(values, target) {
      let lo = 0, hi = values.length;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (values[mid] < target) lo = mid + 1; else hi = mid; }
      return lo;
    }

    function getLineBaseDepartures(lineId, dayType, dir = 1) {
      const key = `${lineId}|${dayType}|${dir}`;
      if (TIMETABLE_CACHE[key]) return TIMETABLE_CACHE[key];
      const meta = LINES_META[lineId];
      if (!meta) return [];
      const service = meta.directionalService?.[String(dir)];
      const [sh, sm] = (service?.start || meta.start).split(':').map(Number);
      const [eh, em] = (service?.end || meta.end).split(':').map(Number);
      const start = sh * 3600 + sm * 60, end = eh * 3600 + em * 60;
      const deps = [];
      if (lineId === '1b') {
        const schedule = dir === 1 ? meta.fromShahed : meta.fromParand;
        for (const min of schedule) if (min * 60 >= start && min * 60 <= end) deps.push(min * 60);
      } else {
        for (let t = start; t <= end;) {
          deps.push(Math.round(t));
          const headway = service?.headwaySeconds || getHeadway(lineId, t / 60, dayType) * 60;
          if (!(headway > 0)) break;
          t += headway;
        }
      }
      TIMETABLE_CACHE[key] = deps;
      return deps;
    }

    function getUpcomingArrivals(stationId, lineId, dir, curSec, dayType) {
      const stops = getTripStops(lineId, dir), index = stops.findIndex(s => s.sid === stationId);
      if (index < 0 || index === stops.length - 1) return [];
      const stop = stops[index], deps = getLineBaseDepartures(lineId, dayType, dir), result = [];
      // A boarding train remains on the board until its modelled departure.
      const first = lowerBound(deps, curSec - stop.departure);
      for (let i = first; i < deps.length && result.length < 3; i++) {
        const arrSec = deps[i] + stop.arrival;
        const departureSec = deps[i] + stop.departure;
        result.push({ arrSec, departureSec, waitSec: Math.max(0, Math.ceil(arrSec - curSec)),
          isDwelling: curSec >= (index === 0 ? arrSec - SCHEDULE_INFO.dwellSeconds : arrSec) && curSec <= departureSec,
          tripId: `${lineId}:${dir}:${deps[i]}` });
      }
      return result;
    }

    function locateTrip(lid, dir, departure, now) {
      const stops = getTripStops(lid, dir);
      if (!stops.length) return null;
      const elapsed = now - departure, last = stops[stops.length - 1];
      if (elapsed < -SCHEDULE_INFO.dwellSeconds || elapsed > last.departure) return null;
      let distance, stationId = null, status = 'moving';
      if (elapsed <= 0) {
        distance = stops[0].distance; stationId = stops[0].sid; status = 'stopped';
      } else {
        for (let i = 1; i < stops.length; i++) {
          const prev = stops[i - 1], next = stops[i];
          if (elapsed < next.arrival) {
            const t = Math.max(0, Math.min(1, (elapsed - prev.departure) / (next.arrival - prev.departure)));
            distance = prev.distance + (next.distance - prev.distance) * t;
            break;
          }
          if (elapsed <= next.departure) {
            distance = next.distance; stationId = next.sid; status = 'stopped'; break;
          }
        }
      }
      if (!Number.isFinite(distance)) return null;
      return { line: lid, dir, departure, distance, stationId, status,
        tripId: `${lid}:${dir}:${departure}`, ...pointOnTrack(lid, distance, dir) };
    }

    function getEstimatedTrains(now, dayType, filter = 'all') {
      const result = [];
      for (const lid of Object.keys(LINES_META)) {
        if (filter !== 'all' && filter !== lid.replace('b', '')) continue;
        for (const dir of [1, -1]) {
          const stops = getTripStops(lid, dir);
          if (!stops.length) continue;
          const deps = getLineBaseDepartures(lid, dayType, dir);
          const start = lowerBound(deps, now - stops[stops.length - 1].departure);
          for (let i = start; i < deps.length && deps[i] <= now + SCHEDULE_INFO.dwellSeconds; i++) {
            const train = locateTrip(lid, dir, deps[i], now);
            if (train) result.push(train);
          }
        }
      }
      return result;
    }

    let manualClockAnchor = { seconds: STATE.secondsOfDay, at: Date.now(), dayType: STATE.dayType };
    let liveClockCache = { second: -1, value: null };
    function setManualClock(seconds, dayType = STATE.dayType, at = Date.now()) {
      STATE.useLiveTime = false;
      STATE.secondsOfDay = seconds;
      STATE.dayType = dayType;
      manualClockAnchor = { seconds, at, dayType };
    }
    function getModelClock(now = Date.now()) {
      if (STATE.useLiveTime) {
        const second = Math.floor(now / 1000);
        if (liveClockCache.second !== second) liveClockCache = { second, value: getTehranLiveClock(new Date(now)) };
        return { seconds: liveClockCache.value.seconds + (now % 1000) / 1000, dayType: liveClockCache.value.dayType };
      }
      const seconds = ((manualClockAnchor.seconds + (now - manualClockAnchor.at) / 1000) % DAY_SECONDS + DAY_SECONDS) % DAY_SECONDS;
      return { seconds, dayType: manualClockAnchor.dayType };
    }
    function arrivalLabel(arrival) {
      if (!arrival) return 'پایان سرویسِ مدل';
      if (arrival.isDwelling) return '🚇 توقف تخمینی';
      const w = arrival.waitSec;
      return `${toFa(pad2(Math.floor(w / 60)))}:${toFa(pad2(w % 60))}`;
    }

    function getFastestNextArrivalForStation(stationId) {
      const st = METRO_DATA.stations[stationId];
      if (!st || st.status === 'construction') return null;
      let best = null;
      for (const lid of st.lines) {
        const seq = getServiceSequence(lid);
        for (const d of [1, -1]) {
          const arr = getUpcomingArrivals(stationId, lid, d, STATE.secondsOfDay, STATE.dayType);
          if (arr.length && (!best || arr[0].waitSec < best.waitSec)) {
            const termId = d === 1 ? seq[seq.length - 1] : seq[0];
            best = { ...arr[0], termFa: METRO_DATA.stations[termId].fa, lineId: lid };
          }
        }
      }
      return best;
    }

    // Keep the supplied placement except these two short vertical adjustments.
    // Checked against all 151 names shaped in the embedded font at wght630/DOTS3,
    // including the label halo and a further 2.4 map-unit margin on each edge.
    // Names stay single-line and next to their own stations, without leader lines.
    const LABEL_Y_OVERRIDES = Object.freeze({ shahrak_azmayesh: 3.2, ayatollah_taleghani: 3.2 });
    function buildMapSVG() {
      const tracksG = document.getElementById('svg-tracks-layer');
      const stationsG = document.getElementById('svg-stations-layer');
      tracksG.innerHTML = '';
      stationsG.innerHTML = '';
      CACHED_LINE_ELS = [];
      CACHED_STATION_ELS = [];

      for (const [lineId, pts] of Object.entries(METRO_DATA.polylines)) {
        const meta = LINES_META[lineId];
        const dStr = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0]},${p[1]}`).join(' ');
        const mainL = lineId.replace('b', '');

        const casing = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        casing.setAttribute('d', dStr);
        casing.setAttribute('class', `metro-line-casing line-el line-${mainL}`);
        tracksG.appendChild(casing);
        CACHED_LINE_ELS.push({ el: casing, line: mainL, dimmed: false });

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', dStr);
        path.setAttribute('stroke', meta.color);
        path.setAttribute('class', `metro-line-path line-el line-${mainL}`);
        path.addEventListener('click', (e) => {
          e.stopPropagation();
          setLineFilter(STATE.lineFilter === mainL ? 'all' : mainL);
        });
        tracksG.appendChild(path);
        CACHED_LINE_ELS.push({ el: path, line: mainL, dimmed: false });
      }

      const frag = document.createDocumentFragment();
      for (const st of Object.values(METRO_DATA.stations)) {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const mainLinesSet = new Set(st.lines.map(l => l.replace('b', '')));
        g.setAttribute('class', 'station-group');
        g.dataset.id = st.id;
        g.setAttribute('transform', `translate(${st.x},${st.y})`);

        const hit = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hit.setAttribute('class', 'station-hit');
        g.appendChild(hit);

        const isInterchange = st.lines.length > 1;
        const isTerminal = st.diam >= 36 && !isInterchange;
        const c1 = LINES_META[st.lines[0]]?.color || '#FF2D55';

        if (isInterchange) {
          const c2 = LINES_META[st.lines[1]]?.color || c1;
          const outer = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          outer.setAttribute('r', '13.5');
          outer.setAttribute('fill', 'var(--station-fill)');
          outer.setAttribute('stroke', c2);
          outer.setAttribute('stroke-width', '4');
          g.appendChild(outer);

          const inner = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          inner.setAttribute('r', '7.5');
          inner.setAttribute('fill', 'var(--station-fill)');
          inner.setAttribute('stroke', c1);
          inner.setAttribute('stroke-width', '3.5');
          g.appendChild(inner);
        } else if (isTerminal) {
          const term = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          term.setAttribute('r', '14.5');
          term.setAttribute('fill', c1);
          term.setAttribute('stroke', 'var(--station-fill)');
          term.setAttribute('stroke-width', '3');
          g.appendChild(term);
        } else {
          const node = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          node.setAttribute('r', st.status === 'construction' ? '7' : '8.5');
          node.setAttribute('fill', 'var(--station-fill)');
          node.setAttribute('stroke', c1);
          node.setAttribute('stroke-width', '3.2');
          if (st.status === 'construction') node.setAttribute('stroke-dasharray', '3 2.5');
          g.appendChild(node);
        }

        const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        lbl.setAttribute('x', String(st.dx));
        lbl.setAttribute('y', String(LABEL_Y_OVERRIDES[st.id] ?? st.dy));
        lbl.setAttribute('text-anchor', st.anchor);
        lbl.setAttribute('class', 'station-label-fa');

        // Full supplied name, one SVG text run: no tspan or truncation.
        lbl.textContent = st.fa + '\u200F';
        lbl.setAttribute('aria-label', st.fa);
        lbl.style.whiteSpace = 'nowrap';
        g.appendChild(lbl);

        g.addEventListener('click', (e) => {
          e.stopPropagation();
          openStationTapBubble(st.id, e.clientX, e.clientY);
        });

        frag.appendChild(g);
        CACHED_STATION_ELS.push({ el: g, sid: st.id, lines: mainLinesSet, dimmed: false });
      }
      stationsG.appendChild(frag);
    }

    // Prebuild Graph Once at Startup
    function initRoutingGraph() {
      ADJ_GRAPH = {};
      for (const sid of Object.keys(METRO_DATA.stations)) ADJ_GRAPH[sid] = [];
      for (const lid of Object.keys(METRO_DATA.lineSequences)) {
        const seq = getServiceSequence(lid);
        const segMin = (LINES_META[lid].sec || 135) / 60;
        for (let i = 0; i < seq.length - 1; i++) {
          const u = seq[i], v = seq[i + 1];
          if (METRO_DATA.stations[u].status === 'construction' || METRO_DATA.stations[v].status === 'construction') continue;
          const raw = METRO_DATA.lineSequences[lid];
          const time = Math.abs(raw.indexOf(v) - raw.indexOf(u)) * segMin;
          ADJ_GRAPH[u].push({ to: v, line: lid, time });
          ADJ_GRAPH[v].push({ to: u, line: lid, time });
        }
      }
    }

    // SVG stays sharp at every map scale. Reuse one vector glyph and retain its
    // instance per trip. No bitmap upscaling, canvas clears, or per-frame layout.
    // Positions freeze during touch and catch up to wall-clock time on release.
    const trainLayer = document.getElementById('svg-trains-layer');
    const trainElements = new Map();
    const reducedTrainMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let trainAnimationFrame = null;
    let lastTrainFrame = -Infinity;

    function initTrains() { buildTrainGeometry(); STATE.trains = []; }
    function pauseTrainAnimation() {
      if (trainAnimationFrame !== null) cancelAnimationFrame(trainAnimationFrame);
      trainAnimationFrame = null;
    }
    function resumeTrainAnimation() {
      if (document.hidden || STATE.isInteractingWithMap || trainAnimationFrame !== null) return;
      lastTrainFrame = -Infinity;
      trainAnimationFrame = requestAnimationFrame(drawTrainsFrame);
    }
    function renderTrainMarkers(trains) {
      const active = new Set();
      for (const tr of trains) {
        active.add(tr.tripId);
        let marker = trainElements.get(tr.tripId);
        if (!marker) {
          marker = document.createElementNS('http://www.w3.org/2000/svg', 'use');
          marker.setAttribute('href', '#train-marker-shape');
          marker.setAttribute('color', LINES_META[tr.line].color);
          marker.setAttribute('aria-hidden', 'true');
          trainLayer.appendChild(marker);
          trainElements.set(tr.tripId, marker);
        }
        marker.setAttribute('transform', `translate(${tr.x} ${tr.y}) rotate(${tr.angle * 180 / Math.PI})`);
      }
      for (const [id, marker] of trainElements) {
        if (!active.has(id)) { marker.remove(); trainElements.delete(id); }
      }
    }
    function drawTrainsFrame(frameTime = performance.now()) {
      trainAnimationFrame = null;
      if (document.hidden || STATE.isInteractingWithMap) return;
      const interval = reducedTrainMotion.matches ? 1000 : 1000 / 30;
      if (frameTime - lastTrainFrame >= interval) {
        lastTrainFrame = frameTime;
        const clock = getModelClock();
        STATE.trains = getEstimatedTrains(clock.seconds, clock.dayType, STATE.lineFilter);
        renderTrainMarkers(STATE.trains);
      }
      trainAnimationFrame = requestAnimationFrame(drawTrainsFrame);
    }

    // Mobile-First Multi-Touch Pinch-to-Zoom & Momentum Pan Engine
    const mapStage = document.getElementById('map-stage');
    const mapSvg = document.getElementById('metro-svg');
    const activePointers = new Map();
    let prevPinchDist = null;
    let prevPinchCenter = null;
    let interactionTimer = null;

    function markInteracting(ms = 140) {
      STATE.isInteractingWithMap = true;
      pauseTrainAnimation();
      clearTimeout(interactionTimer);
      interactionTimer = setTimeout(() => {
        if (activePointers.size) return;
        STATE.isInteractingWithMap = false;
        resumeTrainAnimation();
      }, ms);
    }

    let mapTransformFrame = null;
    let mapTransitionUntil = 0;
    let cameraTween = null;
    let renderedCamera = { panX: STATE.panX, panY: STATE.panY, zoom: STATE.zoom };
    let gestureTravel = 0;
    let suppressMapClickUntil = 0;

    function renderMapCamera(camera) {
      renderedCamera = { ...camera };
      // Let the SVG renderer rasterize vectors/text at the actual output size.
      // CSS scale/translate3d + promoted layers can upscale a cached low-res map.
      mapSvg.setAttribute('viewBox', `${-camera.panX / camera.zoom} ${-camera.panY / camera.zoom} ${window.innerWidth / camera.zoom} ${window.innerHeight / camera.zoom}`);
    }

    function freezeMapTransform() {
      if (cameraTween) {
        STATE.panX = renderedCamera.panX;
        STATE.panY = renderedCamera.panY;
        STATE.zoom = renderedCamera.zoom;
      }
      if (mapTransformFrame !== null) cancelAnimationFrame(mapTransformFrame);
      mapTransformFrame = null; mapTransitionUntil = 0; cameraTween = null;
      renderMapCamera(STATE);
    }

    function renderMapCameraFrame(frameTime) {
      mapTransformFrame = null;
      if (!cameraTween) { renderMapCamera(STATE); return; }
      const { from, to, start, duration } = cameraTween;
      const t = Math.max(0, Math.min(1, (frameTime - start) / duration));
      const eased = 1 - Math.pow(1 - t, 3);
      renderMapCamera({
        panX: from.panX + (to.panX - from.panX) * eased,
        panY: from.panY + (to.panY - from.panY) * eased,
        zoom: from.zoom + (to.zoom - from.zoom) * eased
      });
      if (t < 1) mapTransformFrame = requestAnimationFrame(renderMapCameraFrame);
      else { cameraTween = null; mapTransitionUntil = 0; }
    }

    function applyTransform(smooth = false) {
      if (smooth && !reducedTrainMotion.matches) {
        const duration = 220;
        cameraTween = {
          from: { ...renderedCamera },
          to: { panX: STATE.panX, panY: STATE.panY, zoom: STATE.zoom },
          start: performance.now(), duration
        };
        mapTransitionUntil = performance.now() + duration;
        markInteracting(duration + 30);
      } else { cameraTween = null; mapTransitionUntil = 0; }
      if (mapTransformFrame === null) mapTransformFrame = requestAnimationFrame(renderMapCameraFrame);
    }

    function fitMapToScreen(smooth = true) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const isMobilePortrait = vw < 768 && vh > vw;
      if (isMobilePortrait) {
        const targetZoom = Math.max(0.52, (vw / 1150));
        STATE.zoom = targetZoom;
        STATE.panX = (vw / 2) - (1180 * targetZoom);
        STATE.panY = (vh / 2) - (670 * targetZoom);
      } else {
        const scale = Math.min(vw / 2040, vh / 1480) * 0.94;
        STATE.zoom = scale;
        STATE.panX = (vw - 1984 * scale) / 2;
        STATE.panY = (vh - 1417 * scale) / 2;
      }
      applyTransform(smooth);
    }

    function centerOnMapPoint(svgX, svgY, targetZoom = 1.15) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      STATE.zoom = Math.max(STATE.zoom, targetZoom);
      const visibleCenterY = STATE.activeSheetPane ? (vh * 0.34) : (vh * 0.48);
      STATE.panX = (vw / 2) - svgX * STATE.zoom;
      STATE.panY = visibleCenterY - svgY * STATE.zoom;
      applyTransform(true);
    }

    function zoomAroundScreenPoint(factor, screenX, screenY, smooth = false) {
      if (smooth) freezeMapTransform();
      const nextZoom = Math.min(3.2, Math.max(0.28, STATE.zoom * factor));
      const ratio = nextZoom / STATE.zoom;
      STATE.panX = screenX - (screenX - STATE.panX) * ratio;
      STATE.panY = screenY - (screenY - STATE.panY) * ratio;
      STATE.zoom = nextZoom;
      applyTransform(smooth);
    }

    mapStage.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (!activePointers.size) { freezeMapTransform(); gestureTravel = 0; }
      closeTapBubble();
      document.getElementById('top-search-dropdown').classList.remove('open');
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      markInteracting();
      resetPinchReference();
    });

    window.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;
      const prev = activePointers.get(e.pointerId);
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      gestureTravel += Math.hypot(e.clientX - prev.x, e.clientY - prev.y);
      if (gestureTravel > 6 || activePointers.size > 1) suppressMapClickUntil = Date.now() + 350;
      markInteracting();

      if (activePointers.size === 1) {
        const dx = e.clientX - prev.x;
        const dy = e.clientY - prev.y;
        STATE.panX += dx;
        STATE.panY += dy;
        applyTransform(false);
      } else if (activePointers.size === 2) {
        const pts = Array.from(activePointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const center = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
        if (prevPinchDist && prevPinchDist > 10) {
          const factor = dist / prevPinchDist;
          STATE.panX += center.x - prevPinchCenter.x;
          STATE.panY += center.y - prevPinchCenter.y;
          zoomAroundScreenPoint(factor, center.x, center.y, false);
        }
        prevPinchDist = dist;
        prevPinchCenter = center;
      }
    });

    function resetPinchReference() {
      if (activePointers.size === 2) {
        const pts = Array.from(activePointers.values());
        prevPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        prevPinchCenter = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      } else {
        prevPinchDist = null; prevPinchCenter = null;
      }
    }

    function onPointerUpOrCancel(e) {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.delete(e.pointerId);
      if (!activePointers.size) {
        if (gestureTravel > 6) suppressMapClickUntil = Date.now() + 350;
        markInteracting(100);
      }
      resetPinchReference();
    }
    window.addEventListener('pointerup', onPointerUpOrCancel);
    window.addEventListener('pointercancel', onPointerUpOrCancel);
    window.addEventListener('blur', () => { activePointers.clear(); prevPinchDist = null; prevPinchCenter = null; markInteracting(100); });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { activePointers.clear(); pauseTrainAnimation(); }
      else { STATE.isInteractingWithMap = false; tickClock(); resumeTrainAnimation(); }
    });

      const delta = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? window.innerHeight : 1);
      zoomAroundScreenPoint(Math.exp(-Math.max(-180, Math.min(180, delta)) * 0.002), e.clientX, e.clientY, false);
    }, { passive: false });

    // Cached Dijkstra Optimal Routing (<0.2ms execution)
    function computeRoute(originId, destId, mode) {
      if (!originId || !destId || originId === destId) return null;
      const cacheKey = `${originId}|${destId}|${mode}`;
      let steps = ROUTE_PATH_CACHE.get(cacheKey);

      if (!steps) {
        const penalty = mode === 'fewest' ? 42 : 5;
        const dist = {}, prev = {}, pq = [];
        const startKey = `${originId}|0`;
        dist[startKey] = 0;
        pq.push({ key: startKey, sid: originId, line: null, cost: 0 });

        while (pq.length) {
          pq.sort((a, b) => a.cost - b.cost);
          const cur = pq.shift();
          if (cur.cost > (dist[cur.key] ?? Infinity)) continue;
          if (cur.sid === destId) {
            steps = [];
            let k = cur.key;
            while (k && prev[k]) { steps.unshift(prev[k]); k = prev[k].prevKey; }
            ROUTE_PATH_CACHE.set(cacheKey, steps);
            break;
          }
          for (const edge of (ADJ_GRAPH[cur.sid] || [])) {
            const transfer = cur.line !== null && cur.line !== edge.line;
            const nextKey = `${edge.to}|${edge.line}`;
            const nc = cur.cost + edge.time + (transfer ? penalty : 0);
            if (nc < (dist[nextKey] ?? Infinity)) {
              dist[nextKey] = nc;
              prev[nextKey] = { prevKey: cur.key, from: cur.sid, to: edge.to, line: edge.line, time: edge.time };
              pq.push({ key: nextKey, sid: edge.to, line: edge.line, cost: nc });
            }
          }
        }
      }

      return steps ? buildRouteSummary(originId, destId, steps) : null;
    }

    function buildRouteSummary(originId, destId, steps) {
      if (!steps.length) return null;
      const legs = [];
      let cur = null;
      for (const s of steps) {
        if (!cur || cur.line !== s.line) {
          if (cur) legs.push(cur);
          const seq = getServiceSequence(s.line);
          const dir = seq.indexOf(s.to) > seq.indexOf(s.from) ? 1 : -1;
          const termId = dir === 1 ? seq[seq.length - 1] : seq[0];
          cur = {
            line: s.line,
            dir,
            termFa: METRO_DATA.stations[termId].fa,
            from: s.from,
            to: s.to,
            stops: [s.from, s.to],
            timeMin: s.time
          };
        } else {
          cur.to = s.to;
          cur.stops.push(s.to);
          cur.timeMin += s.time;
        }
      }
      if (cur) legs.push(cur);

      const first = legs[0];
      const arr = getUpcomingArrivals(originId, first.line, first.dir, STATE.secondsOfDay, STATE.dayType);
      const waitSec = arr.length ? arr[0].waitSec : 180;
      const rideMin = legs.reduce((a, l) => a + l.timeMin, 0);
      const transfers = Math.max(0, legs.length - 1);
      const totalMin = Math.max(2, Math.round(waitSec / 60 + rideMin + transfers * 5));

      return { originId, destId, legs, totalStops: steps.length, transfers, waitSec, totalMin, noService: !arr.length };
    }

    // Fast Diff-Based Map Route Overlay & Dimming (Zero DOM Thrashing!)
    function syncMapHighlights(fitRoute = false) {
      const routeLayer = document.getElementById('svg-route-layer');
      const pinsLayer = document.getElementById('svg-pins-layer');
      routeLayer.innerHTML = '';
      pinsLayer.innerHTML = '';

      const route = STATE.currentRoute;
      const activeStations = new Set();

      if (route) {
        for (const leg of route.legs) {
          leg.stops.forEach(s => activeStations.add(s));
          const pts = trackSlice(leg.line, leg.stops[0], leg.stops[leg.stops.length - 1]).map(p => `${p.x},${p.y}`);
          const dStr = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p}`).join(' ');
          const color = LINES_META[leg.line].color;

          const solid = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          solid.setAttribute('d', dStr);
          solid.setAttribute('stroke', color);
          solid.setAttribute('class', 'route-line-solid');
          routeLayer.appendChild(solid);

          const flow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          flow.setAttribute('d', dStr);
          flow.setAttribute('class', 'route-line-flow');
          routeLayer.appendChild(flow);
        }
      }

      for (const [sid, col, txt] of [[STATE.originId, '#30D158', 'مبدأ'], [STATE.destId, '#FF453A', 'مقصد']]) {
        if (!sid || !METRO_DATA.stations[sid]) continue;
        const st = METRO_DATA.stations[sid];
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `translate(${st.x},${st.y - 24})`);
        g.innerHTML = `
          <rect x="-26" y="-13" width="52" height="22" rx="11" fill="${col}" stroke="#fff" stroke-width="2"/>
          <text x="0" y="2" text-anchor="middle" fill="#fff" font-size="11.5" class="vf-bold">${txt}\u200F</text>
        `;
        pinsLayer.appendChild(g);
      }

      for (let i = 0; i < CACHED_LINE_ELS.length; i++) {
        const item = CACHED_LINE_ELS[i];
        const shouldDim = STATE.lineFilter !== 'all'
          ? (item.line !== STATE.lineFilter)
          : Boolean(route);
        if (item.dimmed !== shouldDim) {
          item.dimmed = shouldDim;
          item.el.classList.toggle('dimmed', shouldDim);
        }
      }

      for (let i = 0; i < CACHED_STATION_ELS.length; i++) {
        const item = CACHED_STATION_ELS[i];
        const shouldDim = STATE.lineFilter !== 'all'
          ? (!item.lines.has(STATE.lineFilter))
          : (route ? !activeStations.has(item.sid) : false);
        if (item.dimmed !== shouldDim) {
          item.dimmed = shouldDim;
          item.el.classList.toggle('dimmed', shouldDim);
        }
      }

      if (fitRoute && route) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        activeStations.forEach(sid => {
          const st = METRO_DATA.stations[sid];
          if (st.x < minX) minX = st.x;
          if (st.y < minY) minY = st.y;
          if (st.x > maxX) maxX = st.x;
          if (st.y > maxY) maxY = st.y;
        });
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        const vw = window.innerWidth;
        const vh = window.innerHeight * 0.48;
        const z = Math.min(1.6, Math.max(0.45, Math.min(vw / (maxX - minX + 340), vh / (maxY - minY + 280))));
        centerOnMapPoint(cx, cy, z);
      }
    }

    function renderRouteView(fitCamera = false) {
      const out = document.getElementById('route-output-area');
      if (!STATE.originId || !STATE.destId) {
        STATE.currentRoute = null;
        syncMapHighlights(false);
        const quickFavsHtml = buildQuickFavoritesInRouteHTML();
        out.innerHTML = `
          ${quickFavsHtml}
          <div class="glass-subcard" style="text-align:center; color:var(--text-sub); font-size:12px; padding:13px;">
            ایستگاه مبدأ و مقصد را جستجو کنید، از دلخواه‌ها انتخاب کنید یا روی نقشه لمس کنید.
          </div>
        `;
        bindQuickFavoriteChipEvents(out);
        return;
      }

      const res = computeRoute(STATE.originId, STATE.destId, STATE.routeMode);
      STATE.currentRoute = res;
      syncMapHighlights(fitCamera);

      if (!res) {
        out.innerHTML = `<div class="glass-subcard" style="text-align:center; color:var(--text-sub); font-size:12px;">لطفاً دو ایستگاه متفاوت انتخاب کنید.</div>`;
        return;
      }

      const wm = Math.floor(res.waitSec / 60);
      const ws = res.waitSec % 60;
      const etaStr = fmtHM(Math.floor((STATE.secondsOfDay + res.totalMin * 60) / 60));
      const routeSaved = isFavRoute(STATE.originId, STATE.destId);

      const legsHtml = res.legs.map((leg, i) => {
        const meta = LINES_META[leg.line];
        const fromFa = METRO_DATA.stations[leg.from].fa;
        const toFaName = METRO_DATA.stations[leg.to].fa;
        const transferNext = i < res.legs.length - 1
          ? `<div style="font-size:11.5px; color:#FFD60A; padding:5px 10px; border-radius:10px; background:rgba(255,214,10,0.12);">🔄 تعویض خط در <strong>${toFaName}</strong> به ${LINES_META[res.legs[i+1].line].name}</div>`
          : '';
        return `
          <div class="glass-subcard" style="border-right: 4px solid ${meta.color};">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="vf-bold" style="font-size:12.5px;">${meta.name} (به سمت ${leg.termFa})</span>
              <span class="tnum" style="font-size:11.5px; color:var(--text-sub);">${toFa(leg.stops.length - 1)} ایستگاه</span>
            </div>

            <span style="color:var(--text-sub);">قطار بعدی در مدل:</span>
            <span class="vf-bold tnum" style="color:var(--emerald);" data-route-countdown="1">${res.noService ? 'پایان سرویسِ مدل' : `${toFa(pad2(wm))}:${toFa(pad2(ws))} دیگر`}</span>
          </div>
          <button type="button" id="btn-save-fav-route" class="pill-action vf-bold" style="height:auto; padding:0 12px; color:${routeSaved ? 'var(--gold)' : 'var(--text-main)'};">
            <span>${routeSaved ? '⭐' : '☆'}</span>

    // Station Live Board View
    function openStationLiveBoard(sid) {
      STATE.selectedStationId = sid;
      const st = METRO_DATA.stations[sid];
      if (st) {
        document.getElementById('input-station-board-search').value = st.fa;
        centerOnMapPoint(st.x, st.y, 1.25);
      }
      openSheetPane('station');
    }

    function renderStationBoardView() {
      const chipsBar = document.getElementById('station-fav-chips-bar');
      if (STATE.favStations.length) {
        const chips = STATE.favStations.map(sid => {
          const s = METRO_DATA.stations[sid];
          if (!s) return '';
          const c = LINES_META[s.lines[0]].color;
          const activeStyle = sid === STATE.selectedStationId ? 'border-color:var(--accent); background:var(--glass-card-hover);' : '';
          return `<button type="button" class="fav-chip vf-med" style="${activeStyle}" data-board-fav-sid="${sid}"><span class="dot-ind" style="background:${c}"></span><span>${s.fa}</span></button>`;
        }).join('');
        chipsBar.innerHTML = `<div class="fav-chips-row">${chips}</div>`;
        chipsBar.querySelectorAll('[data-board-fav-sid]').forEach(b => {
          b.onclick = () => openStationLiveBoard(b.getAttribute('data-board-fav-sid'));
        });
      } else {
        chipsBar.innerHTML = '';
      }

      const out = document.getElementById('station-board-output');
      const st = METRO_DATA.stations[STATE.selectedStationId];
      if (!st) {
        out.innerHTML = `<div class="glass-subcard" style="text-align:center; color:var(--text-sub); font-size:12px; padding:14px;">نام ایستگاه را در کادر بالا جستجو کنید، از ایستگاه‌های دلخواه انتخاب کنید یا روی نقشه لمس کنید.</div>`;
        return;
      }

      const isFav = isFavStation(st.id);

      if (st.status === 'construction') {
        out.innerHTML = `<div class="glass-subcard" style="text-align:center; color:#FFD60A; font-size:12.5px; padding:14px;">🚧 ایستگاه ${st.fa} در حال ساخت است.</div>`;
        return;
      }

      let rows = '';
      for (const lid of st.lines) {
        const meta = LINES_META[lid];
        const seq = getServiceSequence(lid);
        for (const d of [1, -1]) {
          const termId = d === 1 ? seq[seq.length - 1] : seq[0];
          if (termId === st.id) continue;
          const termFa = METRO_DATA.stations[termId].fa;
          const arr = getUpcomingArrivals(st.id, lid, d, STATE.secondsOfDay, STATE.dayType);

          if (!arr.length) {
            rows += `
              <div class="glass-subcard" style="flex-direction:row; justify-content:space-between; align-items:center;">
                <span class="vf-bold" style="font-size:12.5px;">${meta.name} • به سمت ${termFa}</span>
                <span style="font-size:11px; color:var(--text-muted);">سرویس بعدی در این روزِ مدل وجود ندارد</span>
              </div>
            `;
          } else {
            const w = arr[0].waitSec;
            const mm = Math.floor(w / 60), ss = w % 60;
            const nextTimes = arr.slice(1).map(a => fmtHM(Math.floor(a.arrSec / 60))).join(' ، ');
            rows += `
              <div class="glass-subcard" style="border-right:4px solid ${meta.color};">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span class="vf-bold" style="font-size:13px;">به سمت ${termFa} (${meta.name})</span>
                  <span class="vf-bold tnum" style="font-size:15px; color:var(--emerald);" data-board-line="${lid}" data-board-dir="${d}">
                    ${arrivalLabel(arr[0])}
                  </span>
                </div>
                <div style="font-size:11px; color:var(--text-sub);">زمان‌های بعدیِ مدل: <span class="tnum" style="color:var(--text-main);">${nextTimes || '—'}</span></div>
              </div>
            `;
          }
        }
      }

      out.innerHTML = `
        <div style="display:grid; grid-template-columns:1fr 1fr auto; gap:6px;">
          <button type="button" id="board-set-orig" class="pill-action vf-bold" style="color:var(--emerald);">🟢 مبدأ</button>
          <button type="button" id="board-set-dest" class="pill-action vf-bold" style="color:var(--danger);">🔴 مقصد</button>
          <button type="button" id="board-toggle-fav" class="pill-action vf-bold" style="padding:0 12px; color:${isFav ? 'var(--gold)' : 'var(--text-main)'};">
            <span>${isFav ? '⭐' : '☆'}</span>
            <span>دلخواه</span>
          </button>
        </div>
        ${rows}
      `;

      document.getElementById('board-set-orig').onclick = () => { selectOriginStation(st.id); openSheetPane('route'); };
      document.getElementById('board-set-dest').onclick = () => { selectDestStation(st.id); openSheetPane('route'); };
      document.getElementById('board-toggle-fav').onclick = () => toggleFavStation(st.id);
    }

    // Dedicated Favorites Pane (Favorite Routes + Favorite Stations)
    function renderFavoritesPane() {
      const container = document.getElementById('favs-content-area');
      let routesHtml = '';

      if (!STATE.favRoutes.length) {
        routesHtml = `
          <div class="glass-subcard" style="text-align:center; font-size:11.5px; color:var(--text-sub); padding:12px;">

          </div>
        `;

        routesHtml = STATE.favRoutes.map((r, idx) => {

          const summary = computeRoute(r.from, r.to, STATE.routeMode);
          const minTxt = summary ? `${toFa(summary.totalMin)} دقیقه • ${toFa(summary.totalStops)} ایستگاه` : '';
          return `
            <div class="glass-subcard" style="flex-direction:row; align-items:center; justify-content:space-between; gap:8px;">
              <div style="display:flex; flex-direction:column; gap:3px; cursor:pointer; flex:1;" data-launch-fav-route="${idx}">
                <div class="vf-bold" style="font-size:13px;">⭐ ${stO.fa} ← ${stD.fa}</div>
                <div class="tnum" style="font-size:11px; color:var(--emerald);">${minTxt}</div>
              </div>
              <div style="display:flex; align-items:center; gap:5px;">
                <button type="button" class="sync-pill-btn vf-bold" style="color:var(--accent);" data-launch-fav-route="${idx}">نمایش مسیر</button>
                <button type="button" class="circle-glass-btn" style="width:28px; height:28px; font-size:11px;" data-del-fav-route="${idx}" title="حذف">✕</button>
              </div>
            </div>
          `;
        }).join('');
      }

      let stationsHtml = '';
      if (!STATE.favStations.length) {
        stationsHtml = `
          <div class="glass-subcard" style="text-align:center; font-size:11.5px; color:var(--text-sub); padding:12px;">
            ایستگاه دلخواهی ثبت نشده است. از کادر جستجوی بالا یا روی نقشه ایستگاه مورد نظر را اضافه کنید.
          </div>
        `;
      } else {
        stationsHtml = STATE.favStations.map(sid => {
          const st = METRO_DATA.stations[sid];
          if (!st) return '';
          const c = LINES_META[st.lines[0]].color;
          const best = getFastestNextArrivalForStation(sid);
          const nextTxt = best
            ? `تخمینی (${best.termFa}): ${toFa(pad2(Math.floor(best.waitSec / 60)))}:${toFa(pad2(best.waitSec % 60))}`
            : 'پایان سرویس';
          return `
            <div class="glass-subcard" style="border-right:4px solid ${c}; gap:7px;">
              <div style="display:flex; align-items:center; justify-content:space-between;">
                <div style="display:flex; align-items:center; gap:7px; cursor:pointer;" data-focus-fav-st="${sid}">
                  <span class="vf-bold" style="font-size:13.5px;">${st.fa}</span>
                  <span style="font-size:10.5px; color:var(--text-muted);">خط ${toFa(st.lines.map(l=>l.replace('b','')).join('، '))}</span>
                </div>
                <button type="button" class="circle-glass-btn" style="width:26px; height:26px; font-size:11px;" data-del-fav-st="${sid}" title="حذف از دلخواه">✕</button>
              </div>
              <div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
                <span class="tnum vf-med" style="font-size:11.5px; color:var(--emerald);" data-fav-live-sid="${sid}">${nextTxt}</span>
                <div style="display:flex; align-items:center; gap:4px;">
                  <button type="button" class="sync-pill-btn vf-bold" style="height:27px; color:var(--emerald);" data-fav-orig="${sid}">🟢 مبدأ</button>
                  <button type="button" class="sync-pill-btn vf-bold" style="height:27px; color:var(--danger);" data-fav-dest="${sid}">🔴 مقصد</button>
                  <button type="button" class="sync-pill-btn vf-med" style="height:27px;" data-fav-board="${sid}">⏱️ زمان</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      container.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:6px;">
          <div class="vf-bold" style="font-size:12.5px; color:var(--text-sub);">🧭 مسیرهای دلخواه</div>
          ${routesHtml}
        </div>
        <div style="display:flex; flex-direction:column; gap:6px; margin-top:4px;">
          <div class="vf-bold" style="font-size:12.5px; color:var(--text-sub);">⭐ ایستگاه‌های دلخواه (همراه با زمان قطار بعدی)</div>
          ${stationsHtml}
        </div>
      `;

      container.querySelectorAll('[data-launch-fav-route]').forEach(el => {
        el.onclick = () => {
          const r = STATE.favRoutes[parseInt(el.getAttribute('data-launch-fav-route'), 10)];
          if (r) applyFavoriteRoute(r.from, r.to);
        };
      });
      container.querySelectorAll('[data-del-fav-route]').forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const idx = parseInt(el.getAttribute('data-del-fav-route'), 10);
          STATE.favRoutes.splice(idx, 1);
          saveFavoritesToStorage();
          renderFavoritesPane();
        };
      });
      container.querySelectorAll('[data-focus-fav-st]').forEach(el => {
        el.onclick = () => {
          const sid = el.getAttribute('data-focus-fav-st');
          const st = METRO_DATA.stations[sid];
          if (st) centerOnMapPoint(st.x, st.y, 1.35);
        };
      });
      container.querySelectorAll('[data-del-fav-st]').forEach(el => {
        el.onclick = () => toggleFavStation(el.getAttribute('data-del-fav-st'));
      });
      container.querySelectorAll('[data-fav-orig]').forEach(el => {
        el.onclick = () => { selectOriginStation(el.getAttribute('data-fav-orig')); openSheetPane('route'); };
      });
      container.querySelectorAll('[data-fav-dest]').forEach(el => {
        el.onclick = () => { selectDestStation(el.getAttribute('data-fav-dest')); openSheetPane('route'); };
      });
      container.querySelectorAll('[data-fav-board]').forEach(el => {
        el.onclick = () => openStationLiveBoard(el.getAttribute('data-fav-board'));
      });
    }

    function filterStationsByQuery(q) {
      const clean = q.trim().toLowerCase();
      const all = Object.values(METRO_DATA.stations);
      if (!clean) return all.slice(0, 8);
      return all.filter(st =>
        st.fa.includes(clean) ||
        st.en.toLowerCase().includes(clean) ||
        st.alts.some(a => a.includes(clean))
      ).slice(0, 8);
    }

    function bindAutocompleteInput(inputEl, containerEl, onPick) {
      function updateList() {
        const list = filterStationsByQuery(inputEl.value);
        if (!list.length) {
          containerEl.innerHTML = `<div style="padding:10px; font-size:12px; color:var(--text-muted); text-align:center;">ایستگاهی یافت نشد</div>`;
        } else {
          containerEl.innerHTML = list.map(st => {
            const c = LINES_META[st.lines[0]].color;
            const favBadge = isFavStation(st.id) ? '<span style="color:var(--gold); font-size:11px;">⭐</span>' : '';
            return `
              <div class="dropdown-item" data-sid="${st.id}">
                <div style="display:flex; align-items:center; gap:7px;">
                  <span class="dot-ind" style="background:${c}"></span>
                  <span class="vf-med" style="font-size:13px;">${st.fa}</span>
                  ${favBadge}
                </div>
                <span style="font-size:10.5px; color:var(--text-muted);">خط ${toFa(st.lines.map(l=>l.replace('b','')).join('، '))}</span>
              </div>
            `;
          }).join('');
          containerEl.querySelectorAll('.dropdown-item').forEach(el => {
            el.addEventListener('click', () => {
              const sid = el.getAttribute('data-sid');
              containerEl.classList.remove('open');
              onPick(sid);
            });
          });
        }
        containerEl.classList.add('open');
      }

      inputEl.addEventListener('input', updateList);
      inputEl.addEventListener('focus', updateList);
    }

    function setLineFilter(line) {
      STATE.lineFilter = line;
      document.querySelectorAll('#line-pills-strip .mini-line-pill[data-line]').forEach(b => {
        b.classList.toggle('active', b.dataset.line === line);
      });
      syncMapHighlights(false);
    }

    // Lightweight 1-Second Ticker
    function tickClock() {
      const clock = getModelClock();
      STATE.secondsOfDay = Math.floor(clock.seconds);
      STATE.dayType = clock.dayType;
      document.getElementById('top-clock-text').textContent = fmtHM(Math.floor(STATE.secondsOfDay / 60));

      if (STATE.activeSheetPane === 'settings' && STATE.useLiveTime) {
        syncClockSliderUI();
      }

      if (STATE.activeSheetPane === 'station' && STATE.selectedStationId) {
        renderStationBoardView();
      }

      if (document.getElementById('map-tap-bubble').classList.contains('open') && STATE.selectedStationId) {
        const st = METRO_DATA.stations[STATE.selectedStationId];
        const best = getFastestNextArrivalForStation(st.id);
        document.getElementById('bubble-st-next').textContent = st.status === 'construction'
          ? '🚧 ایستگاه در حال ساخت'
          : best ? `تخمینی (${best.termFa}): ${arrivalLabel(best)}` : 'در این ساعت زمانی ثبت نشده';
      }
      if (STATE.activeSheetPane === 'route' && STATE.currentRoute) {
        const first = STATE.currentRoute.legs[0];
        const next = getUpcomingArrivals(STATE.originId, first.line, first.dir, STATE.secondsOfDay, STATE.dayType)[0];
        const countdown = document.querySelector('[data-route-countdown]');
        if (countdown) countdown.textContent = arrivalLabel(next);
      }

      if (STATE.activeSheetPane === 'favs') {
        document.querySelectorAll('[data-fav-live-sid]').forEach(el => {
          const sid = el.getAttribute('data-fav-live-sid');
          const best = getFastestNextArrivalForStation(sid);
          if (best) {
            el.textContent = `تخمینی (${best.termFa}): ${arrivalLabel(best)}`;
          } else { el.textContent = 'در این ساعت زمانی ثبت نشده'; }
        });
      }
    }

    // Initialize All UI Events
    function initApp() {
      loadFavoritesFromStorage();
      initTrains();
      initRoutingGraph();
      buildMapSVG();
      fitMapToScreen(false);
      tickClock();
      syncClockSliderUI();

      // Top Search
      const topInput = document.getElementById('top-search-input');
      const topDrop = document.getElementById('top-search-dropdown');
      bindAutocompleteInput(topInput, topDrop, (sid) => {
        topInput.value = '';
        const st = METRO_DATA.stations[sid];
        if (st) {
          centerOnMapPoint(st.x, st.y, 1.35);
          setTimeout(() => openStationTapBubble(sid, window.innerWidth / 2, window.innerHeight * 0.44), 240);
        }
      });

      // Route Origin, Dest, Station Board & Favorite Add Searchable Inputs
      bindAutocompleteInput(
        document.getElementById('input-origin-search'),
        document.getElementById('suggest-origin'),
        (sid) => selectOriginStation(sid)
      );
      bindAutocompleteInput(
        document.getElementById('input-dest-search'),
        document.getElementById('suggest-dest'),
        (sid) => selectDestStation(sid)
      );
      bindAutocompleteInput(
        document.getElementById('input-station-board-search'),
        document.getElementById('suggest-station-board'),
        (sid) => openStationLiveBoard(sid)
      );
      const favAddInput = document.getElementById('input-fav-station-add');
      bindAutocompleteInput(
        favAddInput,
        document.getElementById('suggest-fav-add'),
        (sid) => {
          favAddInput.value = '';
          if (!isFavStation(sid)) toggleFavStation(sid);
          else renderFavoritesPane();
        }
      );

      document.getElementById('clear-origin-btn').onclick = () => {
        STATE.originId = null;
        document.getElementById('input-origin-search').value = '';
        document.getElementById('clear-origin-btn').style.display = 'none';
        renderRouteView(false);
      };
      document.getElementById('clear-dest-btn').onclick = () => {
        STATE.destId = null;
        document.getElementById('input-dest-search').value = '';
        document.getElementById('clear-dest-btn').style.display = 'none';
        renderRouteView(false);
      };

      document.getElementById('btn-swap-route').onclick = () => {
        const tmp = STATE.originId;
        STATE.originId = STATE.destId;
        STATE.destId = tmp;
        document.getElementById('input-origin-search').value = STATE.originId ? METRO_DATA.stations[STATE.originId].fa : '';
        document.getElementById('input-dest-search').value = STATE.destId ? METRO_DATA.stations[STATE.destId].fa : '';
        document.getElementById('clear-origin-btn').style.display = STATE.originId ? 'block' : 'none';
        document.getElementById('clear-dest-btn').style.display = STATE.destId ? 'block' : 'none';
        renderRouteView(true);
      };

      // Route Mode Segmented Control (Instant, Zero-Lag Switch)
      ['seg-fastest', 'seg-fewest'].forEach(id => {
        document.getElementById(id).onclick = (e) => {
          const nextMode = e.currentTarget.dataset.mode;
          if (STATE.routeMode === nextMode) return;
          document.getElementById('seg-fastest').classList.remove('active');
          document.getElementById('seg-fewest').classList.remove('active');
          e.currentTarget.classList.add('active');
          STATE.routeMode = nextMode;
          requestAnimationFrame(() => renderRouteView(false));
        };
      });

      // Line Filter Strip
      document.querySelectorAll('#line-pills-strip .mini-line-pill[data-line]').forEach(btn => {
        btn.onclick = () => setLineFilter(btn.dataset.line);
      });

      // Bottom Dock Buttons
      document.getElementById('dock-btn-route').onclick = () => {
        if (STATE.activeSheetPane === 'route') closeSheet();
        else openSheetPane('route');
      };
      document.getElementById('dock-btn-station').onclick = () => {
        if (STATE.activeSheetPane === 'station') closeSheet();
        else openSheetPane('station');
      };
      document.getElementById('dock-btn-favs').onclick = () => {
        if (STATE.activeSheetPane === 'favs') closeSheet();
        else openSheetPane('favs');
      };
      document.getElementById('dock-btn-fit').onclick = () => {
        setMapFullscreen(true);
        fitMapToScreen(true);
      };

      document.getElementById('btn-zoom-in').onclick = () => zoomAroundScreenPoint(1.3, window.innerWidth / 2, window.innerHeight / 2, true);
      document.getElementById('btn-zoom-out').onclick = () => zoomAroundScreenPoint(0.76, window.innerWidth / 2, window.innerHeight / 2, true);

      document.getElementById('btn-close-sheet').onclick = closeSheet;
      document.getElementById('sheet-grabber').onclick = closeSheet;
      document.getElementById('btn-close-bubble').onclick = closeTapBubble;

      // Top Bar Actions
      document.getElementById('btn-sync-info').onclick = () => openSheetPane('settings');
      document.getElementById('btn-clock-sheet').onclick = () => openSheetPane('settings');

      // 60FPS Zero-Lag Day / Night Switch via GPU Opacity Veil
      document.getElementById('btn-theme-switch').onclick = () => {
        markInteracting(320);
        const veil = document.getElementById('theme-veil');
        const oldBg = STATE.theme === 'night' ? '#060911' : '#F4F2EC';
        const next = STATE.theme === 'night' ? 'day' : 'night';

        veil.style.transition = 'none';
        veil.style.backgroundColor = oldBg;
        veil.style.opacity = '0.88';
        void veil.offsetWidth;

        STATE.theme = next;
        document.documentElement.setAttribute('data-theme', next);
        document.getElementById('theme-icon').textContent = next === 'night' ? '🌙' : '☀️';

        requestAnimationFrame(() => {
          veil.style.transition = 'opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1)';
          veil.style.opacity = '0';
        });
      };

      // Settings Time Slider & Instant Live Tehran Clock Reset
      const sTime = document.getElementById('slider-time');
      sTime.oninput = () => {
        setManualClock(parseInt(sTime.value, 10) * 60);
        tickClock();
        syncClockSliderUI();
        document.getElementById('top-clock-text').textContent = fmtHM(parseInt(sTime.value, 10));
      };

      document.getElementById('btn-live-clock-reset').onclick = () => {
        STATE.useLiveTime = true;
        tickClock();
        syncClockSliderUI();
        if (STATE.originId && STATE.destId) renderRouteView(false);
        if (STATE.selectedStationId) renderStationBoardView();
      };

      document.querySelectorAll('.day-btn').forEach(b => {
        b.onclick = () => {
          setManualClock(getModelClock().seconds, b.dataset.day);
          tickClock();
          syncClockSliderUI();
        };
      });

      window.addEventListener('resize', () => fitMapToScreen(false));

      setInterval(tickClock, 1000);
      resumeTrainAnimation();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
